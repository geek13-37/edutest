services:
  db:
    image: postgres:17-alpine
    container_name: edutest-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-edutest}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-edutest}
      POSTGRES_DB: ${POSTGRES_DB:-edutest}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # только localhost: БД не должна быть доступна из сети
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-edutest} -d ${POSTGRES_DB:-edutest}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: edutest-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-edutest}:${POSTGRES_PASSWORD:-edutest}@db:5432/${POSTGRES_DB:-edutest}
      JWT_SECRET: ${JWT_SECRET}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:5173}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-minimax/minimax-m3}
      OPENROUTER_FALLBACK_MODELS: ${OPENROUTER_FALLBACK_MODELS:-nvidia/nemotron-3-super-120b-a12b:free}
      ENV: ${ENV:-dev}
    ports:
      # только localhost: наружу API отдаёт nginx-фронт через /api,
      # прямой доступ в обход прокси (и rate limit) закрыт
      - "127.0.0.1:8000:8000"

  frontend:
    build:
      context: ./frontend
    container_name: edutest-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  pgdata:
